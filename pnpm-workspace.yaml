packages:
  - packages/*
  - dev

allowBuilds:
  # postinstall do core-js so imprime mensagem de financiamento; nada a construir
  core-js: false
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@storytype/cli@0.4.0'
  - storytype@0.4.0

overrides:
  esbuild@<=0.24.2: '>=0.25.0'
  # Correcoes de seguranca em dependencias transitivas (pnpm audit)
  esbuild@0.27: '^0.28.2'
  flatted: '^3.4.4'
  form-data: '^4.0.6'
  fflate: '^0.8.3'
  js-cookie: '^3.0.8'
  minimatch@9: '^9.0.9'
  brace-expansion@2: '^2.1.7'
  svgo@3: '^3.3.5'
