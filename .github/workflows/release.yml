name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing do npm (OIDC). O publish nao usa token nenhum: o runner
  # troca este id-token por uma credencial efemera, com escopo de um pacote so.
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read tool versions
        id: tool-versions
        run: |
          NODE_VERSION=$(grep 'nodejs' .tool-versions | awk '{print $2}')
          PNPM_VERSION=$(grep 'pnpm' .tool-versions | awk '{print $2}')
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "pnpm-version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node-version }}

      - name: Setup Python and UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: |
            .tool-versions
            pyproject.toml

      # `changeset publish` publica via `pnpm publish`, nao `npm publish`, entao
      # quem precisa suportar OIDC aqui e o pnpm. Versoes 11.0.x ate 11.1.2 tem
      # uma regressao que devolve 404 no trusted publishing (pnpm/pnpm#11513).
      # A versao vem do .tool-versions e hoje e 11.20.0, acima do corte.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tool-versions.outputs.pnpm-version }}

      - name: Assert pnpm supports OIDC trusted publishing
        run: |
          CURRENT=$(pnpm --version)
          # A regressao vive so na faixa [11.0.0, 11.1.3). O pnpm 10 publica
          # via OIDC normalmente, entao nao da para exigir apenas ">= 11.1.3".
          if [ "${CURRENT%%.*}" = "11" ] && \
             [ "$(printf '%s\n' "11.1.3" "$CURRENT" | sort -V | head -1)" != "11.1.3" ]; then
            echo "pnpm $CURRENT tem a regressao de OIDC (pnpm/pnpm#11513); use >= 11.1.3" >&2
            exit 1
          fi
          echo "pnpm $CURRENT OK para trusted publishing"

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Os mesmos checks do `ci.yml`, antes de construir e antes de publicar.
      #
      # Nao e redundante com a verificacao em push: um merge chega aqui com a
      # arvore resultante, que pode nao ser identica a nenhum commit ja
      # verificado, e o `workflow_dispatch` pode ser disparado de uma branch
      # que o `ci.yml` nao observa. O build sozinho nao cobre: o turbo nao
      # declara `build.dependsOn: test`, entao `pnpm build` verde convive com
      # suite vermelha — e `changeset publish` mandaria assim mesmo para o npm.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Chromium antes do `pnpm test`: o `test` do design-vue roda as play
      # functions em navegador de verdade. Ver o comentario em `ci.yml`.
      - name: Install Chromium for the browser tests
        run: pnpm --filter @opentask/taskin-design-vue exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run changeset:version
          publish: pnpm run changeset:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Catraca de "verde honesto": se algo foi publicado, cada versao no npm
      # precisa ter tag correspondente no remoto. O release de 06/09 publicou 12
      # pacotes e concluiu verde sem empurrar tag nenhuma; este passo faz esse
      # estado misto sair vermelho, que e o unico jeito de pedir atencao.
      # So roda quando houve publish — o run que apenas abre o PR de versao nao
      # tem o que reconciliar.
      - name: Assert published versions are tagged on the remote
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run reconcile:tags
