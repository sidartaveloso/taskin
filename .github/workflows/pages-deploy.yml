name: Deploy site and components to GitHub Pages

# O site fica na raiz do Pages e a galeria de componentes em /components/.
#
# O endereco e `components` e nao `storybook` de proposito: quem consome o
# taskin nao precisa saber qual ferramenta gera aquela pagina, e `components`
# diz o que a pessoa vai encontrar. O Storybook continua sendo a ferramenta,
# so nao aparece na URL.
#
# Um workflow só, de propósito: o `upload-pages-artifact` publica um artefato
# que **substitui o site inteiro**. Dois workflows independentes — um para o
# site, outro para o Storybook — se sobrescreveriam a cada deploy. Quem publica
# tem que montar a árvore completa.
#
# Deploy só a partir da `main`, pela mesma razão. A versão anterior publicava a
# `develop` em /beta/, e como o artefato é substituição total, um push na
# `develop` apagava o que a `main` tinha publicado: foi assim que a pasta de
# produção ficou parada em março enquanto a `develop` seguia publicando. Em
# outros branches este workflow builda e guarda o resultado como artefato de CI,
# para a quebra aparecer no PR sem tocar no site.

# O filtro e por exclusao, e nao por inclusao, de proposito.
#
# A versao anterior listava os pacotes que o site usa — docs, design-vue,
# ui-sense, types-ts. Essa lista e uma copia a mao do grafo de dependencias, e
# divergiu: o `turbo.json` nao estava nela, entao a mudanca que quebrou a
# ordenacao do build do site nao acionou o workflow do site. `pnpm-lock.yaml`,
# `pnpm-workspace.yaml`, `.tool-versions` e qualquer pacote que vire dependencia
# transitiva amanha tinham o mesmo buraco.
#
# Invertido, a divergencia falha para o lado seguro: o default e rodar, e o que
# esta abaixo e so o que comprovadamente nao entra no site. O run custa ~1m25 e
# fora da `main` nem publica, entao rodar de sobra e barato; deixar passar uma
# quebra nao e.
#
# `paths-ignore` so pula quando TODOS os arquivos do push casam — um commit que
# mexe em TASKS/ e no turbo.json roda.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      # Arquivos de task: mudam a cada `taskin start`/`finish`, e o autopilot
      # commita sozinho. E de longe a fonte mais comum de push aqui.
      - "TASKS/**"
      # Registros internos e documentacao que vive no GitHub, nao no site.
      # `packages/docs/**` e o site e NAO esta aqui.
      - "decisoes/**"
      - "padroes/**"
      - "docs/**"
      - ".changeset/**"
      - "*.md"
  pull_request:
    # Repetida a mao: o parser de workflow do GitHub nao resolve anchors YAML.
    paths-ignore:
      # Arquivos de task: mudam a cada `taskin start`/`finish`, e o autopilot
      # commita sozinho. E de longe a fonte mais comum de push aqui.
      - "TASKS/**"
      # Registros internos e documentacao que vive no GitHub, nao no site.
      # `packages/docs/**` e o site e NAO esta aqui.
      - "decisoes/**"
      - "padroes/**"
      - "docs/**"
      - ".changeset/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read tool versions
        id: tool-versions
        run: |
          NODE_VERSION=$(grep 'nodejs' .tool-versions | awk '{print $2}')
          PNPM_VERSION=$(grep 'pnpm' .tool-versions | awk '{print $2}')
          echo "node-version=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "pnpm-version=$PNPM_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node-version }}

      # O `pnpm install` dispara o script `install` do `packages/types-py`, que
      # e um `uv sync`. Sem o uv no PATH o install inteiro morre com
      # `sh: 1: uv: not found`, antes de qualquer build — foi o que derrubou o
      # deploy do site. O release.yml sempre teve este passo; este nao.
      - name: Setup Python and UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"
          cache-dependency-glob: |
            .tool-versions
            pyproject.toml

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tool-versions.outputs.pnpm-version }}

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # Workspace inteiro, sem `--filter`. A versão anterior usava
      # `--filter @opentask/taskin-design-vue` sem o sufixo `...`, então a cadeia
      # de dependências não vinha e o build do Storybook morria com
      # `Failed to resolve entry for package "@opentask/taskin-types"`.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builda os pacotes na ordem do turbo. Inclui o `@taskin/docs`, cujo
      # `build` é o `vitepress build content` — o dist do site sai daqui.
      - name: Build packages and site
        run: pnpm build
        env:
          NODE_ENV: production
          # Sem `VITE_POSTHOG_KEY` o analytics nao inicializa e o build segue —
          # e o que permite rodar em fork e em PR sem a credencial.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PERSON_PROFILES: ${{ vars.VITE_POSTHOG_PERSON_PROFILES }}

      # O Storybook da raiz, nao o do `design-vue`: ele varre os dois pacotes e
      # publica uma galeria so. Ate aqui o `ui-sense` nunca chegou ao site —
      # nenhum passo o buildava, entao `WebcamVideo`, `TrackingControls` e a
      # familia de gestos existiam apenas na maquina de quem rodava `storybook`
      # naquele pacote.
      - name: Build the component gallery
        run: pnpm run build:storybook
        env:
          NODE_ENV: production
          # Sem `VITE_POSTHOG_KEY` o analytics nao inicializa e o build segue —
          # e o que permite rodar em fork e em PR sem a credencial.
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_POSTHOG_PERSON_PROFILES: ${{ vars.VITE_POSTHOG_PERSON_PROFILES }}

      - name: Assemble the Pages tree
        run: |
          set -euo pipefail

          SITE=packages/docs/content/.vitepress/dist
          STORYBOOK=storybook-static

          test -f "$SITE/index.html" || { echo "site nao buildou: $SITE/index.html ausente"; exit 1; }
          test -f "$STORYBOOK/index.html" || { echo "storybook nao buildou: $STORYBOOK/index.html ausente"; exit 1; }

          # Badge com o commit, para dar para saber o que esta no ar
          echo "<div style='position:fixed;bottom:10px;right:10px;background:#333;color:#fff;padding:5px 10px;border-radius:5px;font-size:12px;z-index:9999;'>$(git rev-parse --short HEAD)</div>" >> "$STORYBOOK/index.html"

          mkdir -p deploy/components
          cp -r "$SITE/." deploy/
          cp -r "$STORYBOOK/." deploy/components/

          echo "Arvore montada:"
          ls deploy
          test -f deploy/index.html
          test -f deploy/components/index.html

      # Fora da `main`, o resultado fica como artefato de CI: a quebra aparece
      # no PR e o site publicado nao e tocado.
      - name: Upload preview artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview-${{ github.sha }}
          path: deploy
          retention-days: 7

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "deploy"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
